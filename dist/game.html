<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d1f">
<meta name="color-scheme" content="light dark">
<title>ЦНАП Дорослого Життя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* «ЦНАП Дорослого Життя» — паперова бюрократія. Mobile-first (~390px). */
:root {
  --desk: #d8d0bf;
  --desk-2: #cfc6b2;
  --paper: #fbf7ec;
  --paper-2: #f3ecdb;
  --ink: #23211c;
  --ink-soft: #4a463d;
  --muted: #776f61;
  --line: #d6cbb3;
  --line-strong: #b9ab8e;
  --stamp: #2350a8;
  --stamp-soft: rgba(35, 80, 168, 0.1);
  --danger: #a3332b;
  --board: #121314;
  --board-edge: #2a2c2f;
  --led: #ffb23a;
  --led-dim: rgba(255, 178, 58, 0.18);
  --led-glow: rgba(255, 160, 40, 0.55);
  --btn: #23211c;
  --btn-text: #fbf7ec;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 10px 28px rgba(60, 45, 20, 0.16);
  --radius: 4px;
  --mono: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --led-font: "Press Start 2P", "IBM Plex Mono", monospace;
  --stamp-blend: multiply;
  --gutter: 16px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121211;
    --desk-2: #191816;
    --paper: #23211d;
    --paper-2: #2b2924;
    --ink: #ece6d8;
    --ink-soft: #d2cab9;
    --muted: #a59d8c;
    --line: #3e3a33;
    --line-strong: #5b554a;
    --stamp: #7ea6ff;
    --stamp-soft: rgba(126, 166, 255, 0.12);
    --danger: #ff8a7d;
    --board: #050505;
    --board-edge: #1d1e20;
    --btn: #ece6d8;
    --btn-text: #1a1916;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    --stamp-blend: screen;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121211; --desk-2: #191816; --paper: #23211d; --paper-2: #2b2924;
  --ink: #ece6d8; --ink-soft: #d2cab9; --muted: #a59d8c; --line: #3e3a33; --line-strong: #5b554a;
  --stamp: #7ea6ff; --stamp-soft: rgba(126, 166, 255, 0.12); --danger: #ff8a7d;
  --board: #050505; --board-edge: #1d1e20; --btn: #ece6d8; --btn-text: #1a1916;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --stamp-blend: screen; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--desk);
  background-image: radial-gradient(var(--desk-2) 1px, transparent 1px);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }

/* ---------- Табло ---------- */
.board {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--board);
  border-bottom: 3px solid var(--board-edge);
  padding: calc(10px + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right)) 10px calc(var(--gutter) + env(safe-area-inset-left));
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
}
.board::after {
  content: "";
  position: absolute;
  left: 0; bottom: -3px;
  height: 3px;
  width: var(--progress, 0%);
  background: var(--led);
  box-shadow: 0 0 8px var(--led-glow);
  transition: width 0.4s ease;
}
.board__row { display: flex; justify-content: center; align-items: center; gap: 12px; }
.board__row--sub { justify-content: space-between; margin-top: 8px; min-height: 14px; }
.board__led {
  font-family: var(--led-font);
  color: var(--led);
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: 0.04em;
  text-align: center;
  text-shadow: 0 0 6px var(--led-glow);
  /* матриця світлодіодів */
  background-image: radial-gradient(var(--led-dim) 0.8px, transparent 1.1px);
  background-size: 3px 3px;
  padding: 2px 4px;
}
.board__led--small { font-size: 9px; background: none; }
.board__seals { display: inline-flex; align-items: center; gap: 8px; }
.board__dots { display: inline-flex; gap: 3px; }
.board__dots i {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1px solid var(--led-dim);
  background: transparent;
}
.board__dots i.on { background: var(--led); border-color: var(--led); box-shadow: 0 0 4px var(--led-glow); }
.board__led.is-switching { animation: led-switch 0.7s steps(2, end); }
@keyframes led-switch {
  0%, 40% { opacity: 0.1; }
  20%, 60%, 100% { opacity: 1; }
}

/* ---------- Стіл і бланк ---------- */
.desk {
  max-width: 560px;
  margin: 0 auto;
  padding: 18px calc(var(--gutter) + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
}
.sheet {
  position: relative;
  background: var(--paper);
  background-image: linear-gradient(var(--paper), var(--paper-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 18px 22px;
}
.sheet::before { /* поле для підшивки */
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 10px;
  border-left: 1px dashed var(--line);
  pointer-events: none;
}
.sheet > * { position: relative; }
.sheet__head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: 8px;
  margin-bottom: 14px;
}
.sheet__ticket { white-space: nowrap; }
.sheet__title {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.25;
  margin: 0 0 14px;
}
.sub { font-family: var(--mono); font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; margin: 22px 0 10px; }
.screen-in { animation: sheet-in 0.32s ease-out; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.is-shaken { animation: paper-shake 0.32s ease-out; }
@keyframes paper-shake {
  0% { transform: none; }
  30% { transform: translateY(3px) scale(0.997); }
  60% { transform: translateY(-1px); }
  100% { transform: none; }
}

/* ---------- Лобі ---------- */
.sheet--lobby { text-align: center; padding: 36px 22px 30px; }
.sheet--lobby::before { display: none; }
.lobby__emblem {
  width: 96px; height: 96px;
  margin: 0 auto 18px;
  border: 3px double var(--stamp);
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; letter-spacing: 0.08em;
  color: var(--stamp);
  transform: rotate(-8deg);
}
.lobby__hint { color: var(--muted); margin: 0 0 24px; }

/* ---------- Талон ---------- */
.ticket {
  display: flex; flex-direction: column; align-items: center;
  width: 210px;
  margin: 2px auto 18px;
  padding: 16px 12px 20px;
  background: #fffdf6;
  color: #23211c;
  font-family: var(--mono);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
  transform: rotate(-1.5deg);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 95% 100%, 90% calc(100% - 8px), 85% 100%, 80% calc(100% - 8px), 75% 100%, 70% calc(100% - 8px), 65% 100%, 60% calc(100% - 8px), 55% 100%, 50% calc(100% - 8px), 45% 100%, 40% calc(100% - 8px), 35% 100%, 30% calc(100% - 8px), 25% 100%, 20% calc(100% - 8px), 15% 100%, 10% calc(100% - 8px), 5% 100%, 0 calc(100% - 8px));
  animation: ticket-print 0.6s ease-out;
}
@keyframes ticket-print { from { clip-path: inset(0 0 100% 0); } }
.ticket__caption { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b655a; }
.ticket__number { font-size: 44px; font-weight: 600; letter-spacing: 0.04em; line-height: 1.15; margin: 4px 0; }
.ticket__meta { font-size: 12px; color: #6b655a; }

/* ---------- Працівник ---------- */
.clerk { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 16px; }
.clerk__avatar {
  flex: 0 0 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--stamp-soft);
  border: 1.5px solid var(--stamp);
  color: var(--stamp);
  font-family: var(--mono); font-weight: 600; font-size: 14px;
}
.clerk__body {
  flex: 1; min-width: 0;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 2px 12px 12px 12px;
  padding: 9px 13px;
}
.clerk__name { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.clerk__body p { margin: 0 0 6px; font-style: italic; color: var(--ink-soft); }
.clerk__body p:last-child { margin-bottom: 0; }
.clerk--muted { opacity: 0.8; }
.clerk--reply { margin-top: 14px; animation: sheet-in 0.3s ease-out; }

.rules { margin: 4px 0 18px; padding-left: 22px; font-size: 15.5px; }
.rules li { margin-bottom: 8px; }
.rules li::marker { font-family: var(--mono); color: var(--stamp); }

/* ---------- Віконце ---------- */
.window__plate {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  border: 2px solid var(--ink);
  padding: 16px 12px;
  margin: 2px 0 18px;
  background: var(--paper);
}
.window__no { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.window__title { font-family: var(--mono); font-weight: 600; font-size: 32px; line-height: 1.2; margin: 4px 0; }
.window__sub { font-size: 14.5px; color: var(--muted); font-style: italic; }

/* ---------- Питання і поля ---------- */
.qcard { margin-bottom: 14px; }
.qcard__label { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--stamp); margin-bottom: 6px; }
.qcard__text { font-size: 18px; line-height: 1.5; margin: 0 0 10px; }
.qcard__hint { font-size: 14.5px; color: var(--muted); font-style: italic; margin: 0; }
.qcard__stampnote { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }

.field { display: block; margin: 0 0 6px; }
.field__label { display: block; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
.field__hint { display: block; font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.field__input {
  display: block; width: 100%;
  border: 0;
  border-bottom: 1.5px solid var(--ink);
  background: transparent;
  padding: 10px 2px;
  font-family: var(--mono);
  font-size: 17px; /* ≥16px — iOS не масштабує поле */
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
}
.field__input::placeholder { color: var(--muted); opacity: 0.7; }
.field__input:focus { outline: none; border-bottom-color: var(--stamp); background: var(--stamp-soft); }
.field__input--area {
  resize: none;
  min-height: 150px;
  line-height: 32px;
  padding: 0 4px;
  border: 0;
  overflow: hidden;
  /* графи бланка */
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line-strong) 31px, var(--line-strong) 32px);
  background-attachment: local;
}
.field__input--area:focus { background-color: var(--stamp-soft); }
.copy-fallback { margin-top: 10px; font-size: 13px; line-height: 20px; background-image: none; border: 1px solid var(--line-strong); padding: 8px; overflow: auto; }

.form-error { color: var(--danger); font-size: 15px; font-style: italic; margin: 8px 0 0; min-height: 0; }
.form-error:empty { display: none; }
.form-error.shake { animation: err-shake 0.35s; }
@keyframes err-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.note { font-size: 14.5px; color: var(--muted); font-style: italic; margin: 10px 0 0; }

/* ---------- Кнопки ---------- */
.actions { display: flex; gap: 10px; margin-top: 20px; }
.actions .btn--primary { flex: 1; }
.btn {
  min-height: 52px;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  cursor: pointer;
  border: 2px solid var(--btn);
  touch-action: manipulation;
  transition: transform 0.08s ease, background 0.15s;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn--primary { background: var(--btn); color: var(--btn-text); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--big { min-height: 60px; padding: 14px 30px; font-size: 16px; }
.btn--wide { width: 100%; }
.btn--link { background: none; border: 0; text-decoration: underline; text-transform: none; font-weight: 400; color: var(--muted); }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }

/* ---------- Шкала ---------- */
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0 10px; }
.scale__btn {
  min-height: 56px;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  border-radius: var(--radius);
  font-family: var(--mono); font-size: 20px; font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.scale__btn.is-on { background: var(--stamp); border-color: var(--stamp); color: var(--paper); }
.scale__legend { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--muted); font-style: italic; }
.scale__legend span:last-child { text-align: right; }

/* ---------- Варіанти ---------- */
.options { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
.option {
  display: flex; gap: 12px; align-items: flex-start;
  text-align: left;
  width: 100%;
  min-height: 56px;
  padding: 13px 14px;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  border-radius: var(--radius);
  font-family: var(--serif); font-size: 16.5px; line-height: 1.45;
  cursor: pointer;
  touch-action: manipulation;
}
.option__mark {
  flex: 0 0 28px; height: 28px;
  display: grid; place-items: center;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  font-family: var(--mono); font-weight: 600; font-size: 14px;
}
.option.is-on { border-color: var(--stamp); background: var(--stamp-soft); }
.option.is-on .option__mark { background: var(--stamp); border-color: var(--stamp); color: var(--paper); }

/* ---------- Штамп ---------- */
.stamp-slot { display: flex; justify-content: flex-end; min-height: 0; margin-top: 4px; }
.stamp {
  --rot: -7deg;
  display: inline-flex; flex-direction: column; align-items: center;
  margin: 14px 4px 0;
  padding: 8px 14px 6px;
  border: 3px double var(--stamp);
  border-radius: 6px;
  color: var(--stamp);
  font-family: var(--mono);
  text-transform: uppercase;
  text-align: center;
  transform: rotate(var(--rot));
  mix-blend-mode: var(--stamp-blend);
  opacity: 0.92;
  max-width: 85%;
}
.stamp__title { font-weight: 600; font-size: 15px; line-height: 1.25; letter-spacing: 0.04em; }
.stamp__date { font-size: 10.5px; letter-spacing: 0.1em; margin-top: 3px; border-top: 1px solid currentColor; padding-top: 2px; }
.stamp--mini { --rot: -4deg; margin: 0; padding: 3px 8px 2px; border-width: 2px; max-width: 70%; }
.stamp--mini .stamp__title { font-size: 10px; }
.stamp--mini .stamp__date { display: none; }

/* Та сама виразна анімація «гуп» — для штампів, печаток і фінальної печатки */
.is-thud { animation: thud 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
@keyframes thud {
  0% { transform: scale(2.3) rotate(calc(var(--rot, -7deg) - 10deg)); opacity: 0; filter: blur(2px); }
  55% { transform: scale(0.92) rotate(var(--rot, -7deg)); opacity: 1; filter: none; }
  75% { transform: scale(1.03) rotate(var(--rot, -7deg)); }
  100% { transform: scale(1) rotate(var(--rot, -7deg)); opacity: 0.92; }
}

/* ---------- Печатки ---------- */
.seals__status { font-family: var(--mono); font-size: 14px; margin: 0 0 10px; }
.seals__left { color: var(--stamp); font-size: 16px; }
.seals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-width: 360px; }
.seals__btn {
  --rot: 0deg;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-width: 0;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  border-radius: 50%;
  aspect-ratio: 1;
  cursor: pointer;
  touch-action: manipulation;
  padding: 4px;
}
.seals__num { font-family: var(--mono); font-weight: 600; font-size: 22px; line-height: 1; }
.seals__icons { display: flex; gap: 2px; min-height: 7px; }
.seals__icons i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.seals__btn.is-on { background: var(--stamp); border-color: var(--stamp); color: var(--paper); box-shadow: 0 0 0 3px var(--stamp-soft); }
.seals__btn[disabled] { opacity: 0.25; cursor: not-allowed; text-decoration: line-through; }
.seals__comment { font-style: italic; color: var(--ink-soft); min-height: 1.5em; margin: 12px 0 0; }

/* ---------- Фінал ---------- */
.summary-wrap { overflow-x: auto; margin: 0 -4px; }
.summary { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
.summary th, .summary td { border-bottom: 1px solid var(--line); padding: 8px 4px; text-align: left; vertical-align: top; }
.summary thead th { font-size: 10.5px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
.summary tbody th { font-weight: 600; white-space: nowrap; }
.summary__stamp { color: var(--stamp); font-size: 11px; }
.finale-box { border: 1.5px dashed var(--line-strong); padding: 14px; margin-top: 18px; border-radius: var(--radius); }
.finale-box .btn--wide { margin-top: 12px; }
.finale-box--alt .field__hint { margin-top: 0; }

/* ---------- Документ-витяг ---------- */
.doc-wrap { display: flex; flex-direction: column; gap: 16px; }
.doc {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding: 22px 18px 24px;
  outline: 1px solid var(--line-strong);
  outline-offset: -8px;
}
.doc__issuer { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line-strong); padding: 4px 6px 10px; }
.doc__title { font-family: var(--mono); font-size: 18px; font-weight: 600; line-height: 1.3; text-align: center; text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 12px; }
.doc__number { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--stamp); letter-spacing: 0.05em; }
.doc__meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-family: var(--mono); font-size: 13px; margin: 0 0 16px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.doc__meta dt { color: var(--muted); }
.doc__meta dd { margin: 0; border-bottom: 1px dotted var(--line-strong); font-weight: 600; }
.doc__waiting { font-style: italic; color: var(--muted); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
.doc__cursor { display: inline-block; width: 0.55em; height: 1.05em; background: var(--ink); vertical-align: text-bottom; margin-left: 2px; animation: blink 0.9s steps(2, start) infinite; }
.doc__sign { position: relative; display: flex; justify-content: flex-end; align-items: flex-end; min-height: 150px; margin-top: 28px; }
.doc__seal { position: absolute; left: 4px; bottom: -6px; width: 150px; height: 150px; color: var(--stamp); --rot: -12deg; transform: rotate(var(--rot)); mix-blend-mode: var(--stamp-blend); opacity: 0.92; }
.doc__seal svg { width: 100%; height: 100%; font-family: var(--mono); }
.doc__signature { display: flex; flex-direction: column; align-items: center; width: 56%; text-align: center; }
.doc__scribble { width: 130px; height: 42px; color: var(--ink); }
.doc__scribble svg { width: 100%; height: 100%; }
.doc__line { width: 100%; border-bottom: 1px solid var(--ink); margin: 2px 0 6px; }
.doc__role { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.doc__footer { font-size: 12px; font-style: italic; color: var(--muted); text-align: center; margin: 26px 0 0; }
.doc-tools { display: flex; flex-direction: column; gap: 10px; }

/* Markdown усередині витягу */
.md { font-size: 16.5px; line-height: 1.6; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3 { font-family: var(--mono); line-height: 1.3; }
.md h1 { font-size: 18px; }
.md h2 { font-size: 15.5px; text-transform: uppercase; letter-spacing: 0.04em; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1.5px solid var(--ink); }
.md h3 { font-size: 15px; margin: 18px 0 6px; color: var(--stamp); }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin-bottom: 6px; }
.md blockquote { margin: 0 0 12px; padding: 4px 12px; border-left: 3px solid var(--stamp); color: var(--ink-soft); font-style: italic; }
.md hr { border: 0; border-top: 1px dashed var(--line-strong); margin: 18px 0; }
.md strong { font-weight: 700; }
.md code { font-family: var(--mono); font-size: 0.9em; background: var(--paper-2); padding: 0 3px; }

@media (min-width: 480px) {
  .sheet { padding: 24px 26px 28px; }
  .doc { padding: 30px 30px 32px; }
  .board__led { font-size: 14px; }
  .board__led--small { font-size: 10px; }
}

/* ---------- Менше руху ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .doc__waiting, .doc__cursor { animation: none !important; }
}

// Маленький безпечний рендер markdown → HTML для витягу.
// Підтримує: заголовки, абзаци, жирний/курсив/код, списки (з одним рівнем вкладення),
// цитати, горизонтальні лінії. Увесь вхід екранується — HTML з відповіді моделі не виконується.
var CnapMd = (function () {
  'use strict';

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    var codes = [];
    s = esc(s).replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+?)__/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[\s(«])_(?!\s)([^_]+?)_(?=[\s.,;:!?)»]|$)/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
  }

  function render(src) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    var html = [];
    var para = [];
    var list = null; // { type, items: [{ text, sub: [] }], subType }
    var quote = [];

    function flushPara() {
      if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
    }
    function flushList() {
      if (!list) return;
      var out = '<' + list.type + '>';
      list.items.forEach(function (it) {
        out += '<li>' + inline(it.text);
        if (it.sub.length) {
          out += '<' + (it.subType || 'ul') + '>' + it.sub.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</' + (it.subType || 'ul') + '>';
        }
        out += '</li>';
      });
      html.push(out + '</' + list.type + '>');
      list = null;
    }
    function flushQuote() {
      if (quote.length) { html.push('<blockquote>' + render(quote.join('\n')) + '</blockquote>'); quote = []; }
    }
    function flushAll() { flushPara(); flushList(); flushQuote(); }

    lines.forEach(function (raw) {
      var line = raw.replace(/\s+$/, '');
      var m;
      if (/^\s*>/.test(line)) { flushPara(); flushList(); quote.push(line.replace(/^\s*>\s?/, '')); return; }
      flushQuote();
      if (!line.trim()) { flushPara(); flushList(); return; }
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
        flushAll();
        var lvl = Math.min(m[1].length + 1, 4); // # → h2: головний заголовок уже є у документі
        html.push('<h' + lvl + '>' + inline(m[2].replace(/\s*#+\s*$/, '')) + '</h' + lvl + '>');
        return;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushAll(); html.push('<hr>'); return; }
      if ((m = line.match(/^(\s*)([-*+•]|\d+[.)])\s+(.*)$/))) {
        flushPara();
        var indent = m[1].replace(/\t/g, '  ').length;
        var type = /\d/.test(m[2]) ? 'ol' : 'ul';
        if (indent >= 2 && list && list.items.length) {
          var last = list.items[list.items.length - 1];
          last.sub.push(m[3]);
          last.subType = last.subType || type;
          return;
        }
        if (list && list.type !== type) flushList();
        if (!list) list = { type: type, items: [] };
        list.items.push({ text: m[3], sub: [] });
        return;
      }
      if (list && /^\s{2,}\S/.test(line)) { // продовження пункту списку
        list.items[list.items.length - 1].text += ' ' + line.trim();
        return;
      }
      flushList();
      para.push(line.trim());
    });
    flushAll();
    return html.join('\n');
  }

  return { render: render, inline: inline };
})();

  function extractMeta() {
    var issued = new Date();
    var valid = new Date(issued.getTime() + S.extract.validDays * 864e5);
    var num = S.extract.numberPrefix + '-' + issued.getFullYear() + '/' +
      state.ticket.replace(/\D/g, '') + '-' + String(Math.floor(1000 + Math.random() * 9000));
    return { number: num, issuedAt: issued.toISOString(), validUntil: valid.toISOString() };
  }
  function longDate(iso) {
    return new Date(iso).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function startExtract() {
    var meta = extractMeta();
    state.extract = { number: meta.number, issuedAt: meta.issuedAt, validUntil: meta.validUntil, markdown: '', status: 'streaming', error: null };
    goNext();
    if (session.abort) session.abort.abort();
    session.abort = typeof AbortController !== 'undefined' ? new AbortController() : null;
    CnapApi.streamExtract({
      apiKey: session.apiKey,
      request: CnapPrompt.buildRequest(state, S),
      signal: session.abort && session.abort.signal,
      onText: function (chunk) {
        state.extract.markdown += chunk;
        paintExtractBody();
      }
    }).then(function () {
      state.extract.status = 'done';
      render();
    }, function (err) {
      if (err && err.name === 'AbortError') return;
      state.extract.status = 'error';
      state.extract.error = (err && err.message) || String(err);
      render();
    });
  }

      var ta = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0', readonly: true });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }
  function download(filename, text) {
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  // ---------- Навігація ----------
  var app = document.getElementById('app');

  function render() {
    var step = steps[state.step];
    updateBoard(step);
    app.textContent = '';
    extractBodyNode = null;
    var node = screens[step.type](step);
    node.classList.add('screen-in');
    app.appendChild(node);
    window.scrollTo(0, 0);
    var title = app.querySelector('.sheet__title, .window__no, .doc__title');
    if (title && title.focus) { if (!title.hasAttribute('tabindex')) title.setAttribute('tabindex', '-1'); title.focus({ preventScroll: true }); }
  }
  function goNext() { if (state.step < steps.length - 1) { state.step++; render(); } }
  function goBack() {
    if (state.step <= 0) return;
    state.step--;
    if (steps[state.step].type === 'extract') state.step--;
    render();
  }

  window.addEventListener('beforeunload', function (e) {
    var started = state.ticket && Object.keys(state.answers).length > 0;
    var finished = state.extract && state.extract.status === 'done';
    if (started && !finished) { e.preventDefault(); e.returnValue = ''; }
  });

  render();

  // Доступ для налагодження і майбутнього v2 (localStorage, Telegram).
  window.CNAP = {
    get state() { return state; },
    scenario: S,
    steps: steps,
    sealsLeft: sealsLeft,
    sealsMaxFor: sealsMaxFor,
    render: render
  };
})();

</script>
</body>
</html>
